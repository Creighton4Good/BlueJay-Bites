spring.application.name=bluejaybites
spring.datasource.url=jdbc:mysql://localhost:3306/bluejaybites
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=8080

# Only health and info are exposed. The rest, especially env, configprops,
# beans, and mappings, leak configuration and the full API surface, which
# matters now that the backend is reachable on a public URL.
management.endpoints.web.exposure.include=health,info
# Health details include database and disk status, so they are only shown to
# authorized callers rather than anonymously.
management.endpoint.health.show-details=when-authorized
spring.boot.admin.context-path=/admin-dashboard

spring.boot.admin.client.url=http://localhost:8080/admin-dashboard
info.env.enabled=true

# Enable related features.
spring.cloud.azure.active-directory.enabled=true
# Specifies your Microsoft Entra ID tenant ID:
spring.cloud.azure.active-directory.profile.tenant-id=${TENANT_ID}
# Specifies your App Registration's Application ID:
spring.cloud.azure.active-directory.credential.client-id=${CLIENT_ID}
# Specifies your App Registration's secret key:
spring.cloud.azure.active-directory.credential.client-secret=${CLIENT_SECRET}

spring.config.import=optional:file:.env[.properties]
# Comma-separated list of emails that should be provisioned as admin on first login.
app.admin-emails=

# Photo upload limits and storage location
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
# Default file path for storing photos (can update using env variable in run configuration)
file.upload-dir=${user.home}
